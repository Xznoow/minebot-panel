<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineBot Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>MineBot Panel</h1>

    <main class="layout">
        <aside class="sidebar">
            <h2>Bots</h2>
            <ul id="liste-bots"></ul>

            <form id="form-ajout">
                <h3>Ajouter un bot</h3>
                <input id="ajout-username" placeholder="Pseudo" required maxlength="16"
                       pattern="[A-Za-z0-9_]{3,16}" title="3 à 16 caractères : lettres, chiffres ou _">
                <input id="ajout-host" placeholder="Adresse du serveur" required>
                <input id="ajout-port" type="number" placeholder="Port (facultatif)" min="1" max="65535">
                <button type="submit">Ajouter</button>
                <p id="erreur-ajout" class="erreur"></p>
            </form>
        </aside>

        <section class="console">
            <h2 id="titre-bot">Aucun bot sélectionné</h2>
            <ul id="chat"></ul>
            <form id="form-chat">
                <input id="message" type="text" placeholder="Message à envoyer" autocomplete="off" disabled>
                <button type="submit" disabled>Envoyer</button>
            </form>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
